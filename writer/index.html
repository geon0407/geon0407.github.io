<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 블로그 글쓰기</title>
<style>
:root{color-scheme:light dark;font:16px/1.6 system-ui}body{margin:32px auto;max-width:850px;padding:0 18px}label{display:grid;gap:4px;margin-block:12px}input,select,textarea,button{font:inherit;padding:6px}button{cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}#editor,textarea{box-sizing:border-box;width:100%;min-height:250px;padding:16px;border:1px solid GrayText;border-radius:5px;overflow-wrap:anywhere}#editor{margin-top:10px}#editor pre{white-space:pre-wrap}textarea{min-height:140px}small{color:GrayText}
</style>
<h1>내 블로그 글쓰기</h1>
<p><small>비공개 Codespace에서 글을 편집합니다. 저장 후 Source Control에서 커밋하고 푸시하면 블로그에 반영됩니다.</small></p>
<p><label>기존 글 선택<select id="posts"><option value="">새 글</option></select></label></p><form id="form">
<div class="row"><label>종류<select id="kind"><option value="notes">기술 노트</option><option value="journal">일기</option></select></label><label>날짜<input type="date" id="date" required></label></div>
<label>제목<input id="title" required></label>
<label>한 줄 요약<input id="summary"></label>
<label>태그<input id="tags" placeholder="쉼표로 구분"></label>
<label>파일 이름 (선택, 영문 소문자)<input id="slug" pattern="[a-z0-9]+(-[a-z0-9]+)*"></label>
<h2>본문</h2>
<div class="row" id="tools" aria-label="본문 서식">
<button type="button" data-c="formatBlock" data-v="p">본문</button><button type="button" data-c="formatBlock" data-v="h2">제목</button><button type="button" data-c="bold">굵게</button><button type="button" data-c="italic">기울임</button><button type="button" data-c="insertUnorderedList">글머리 목록</button><button type="button" data-c="insertOrderedList">번호 목록</button><button type="button" data-c="formatBlock" data-v="pre">코드 블록</button><button type="button" data-c="link">링크</button>
</div>
<div id="editor" contenteditable="true" role="textbox" aria-label="본문" aria-multiline="true"></div>
<p><button>저장소 작업 파일에 저장</button></p>
</form>
<p id="status" role="status"></p>
<script>
"use strict";
const $ = id => document.getElementById(id), editor=$('editor'), get=id=>$(id).value.trim();
const today=new Date();
$('date').value=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);
let range=null;
document.addEventListener('selectionchange',()=>{
 const s=getSelection();
 if(s.rangeCount && editor.contains(s.getRangeAt(0).commonAncestorContainer)) range=s.getRangeAt(0).cloneRange();
});
$('tools').addEventListener('mousedown',e=>{if(e.target.closest('button'))e.preventDefault()});
$('tools').addEventListener('click',e=>{
 const button=e.target.closest('button');if(!button)return;
 editor.focus();
 if(range && editor.contains(range.commonAncestorContainer)){const s=getSelection();s.removeAllRanges();s.addRange(range);}
 const cmd=button.dataset.c;
 if(cmd==='link'){
   if(getSelection().isCollapsed){$('status').textContent='링크를 걸 문장을 먼저 선택하세요.';return;}
   const input=prompt('링크 주소 (https://…)');if(!input)return;
   try{const url=new URL(input);if(!['https:','http:'].includes(url.protocol))throw Error();document.execCommand('createLink',false,url.href);}catch{$('status').textContent='http 또는 https 주소를 입력하세요.';}
 }else document.execCommand(cmd,false,button.dataset.v??null);
 
});
editor.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'));});
editor.addEventListener('drop',e=>e.preventDefault());
const escapeMd=s=>s.replace(/[\\`*_{}\[\]<>#+.!|~-]/g,c=>'\\'+c);
function markdown(n){
 if(n.nodeType===3)return escapeMd(n.nodeValue);
 const tag=n.nodeName.toLowerCase(), inner=()=>Array.from(n.childNodes,markdown).join('');
 if(tag==='br')return '  \n';
 if(tag==='pre'){const raw=n.innerText.trimEnd();const mark='`'.repeat(Math.max(3,...Array.from(raw.matchAll(/`+/g),m=>m[0].length+1)));return '\n\n'+mark+'\n'+raw+'\n'+mark+'\n\n';}
 const body=inner();
 if(/^h[1-6]$/.test(tag))return '\n\n'+'#'.repeat(+tag[1])+' '+body.trim()+'\n\n';
 if(['p','div','section'].includes(tag))return '\n\n'+body.trim()+'\n\n';
 if(['b','strong','i','em'].includes(tag)){const mark=['b','strong'].includes(tag)?'**':'*';return body.replace(/^(\s*)(\S[\s\S]*?)(\s*)$/,(_,a,b,c)=>a+mark+b+mark+c);}
 if(tag==='a'){const href=n.getAttribute('href')||'';return /^https?:\/\//i.test(href)?'['+body+'](<'+href.replaceAll('>','%3E')+'>)':body;}
 if(tag==='ul'||tag==='ol')return '\n\n'+Array.from(n.children).filter(li=>li.tagName==='LI').map((li,i)=>{
  const prefix=tag==='ol'?(i+1)+'. ':'- ';
  return prefix+Array.from(li.childNodes,markdown).join('').trim().replaceAll('\n','\n'+' '.repeat(Math.max(4,prefix.length)));
 }).join('\n')+'\n\n';
 return body;
}
$('form').addEventListener('input',()=>{$('result').hidden=true});
const status = message => $('status').textContent=message;
let opened='', revision=null, bodyChanged=false, dirty=false, busy=false;
const postList=$('posts');
async function api(route,data){
 const response=await fetch('/api/'+route,data===undefined?undefined:{method:'POST',headers:{'Content-Type':'application/json','X-Blog-Editor':'1'},body:JSON.stringify(data)});
 const result=await response.json();
 if(!response.ok)throw Error(result.error||'요청 실패');
 return result;
}
async function refresh(){
 postList.replaceChildren(new Option('새 글',''));
 for(const path of await api('posts'))postList.add(new Option(path.replace('content/',''),path));
 postList.value=opened;
}
$('form').addEventListener('input',e=>{dirty=true;if(editor.contains(e.target))bodyChanged=true;});
$('tools').addEventListener('click',()=>{dirty=true;bodyChanged=true;});
window.addEventListener('beforeunload',e=>{if(dirty)e.preventDefault();});
postList.onchange=async()=>{
 const path=postList.value;
 if(busy||(dirty&&!confirm('저장하지 않은 변경 사항을 버릴까요?'))){postList.value=opened;return;}
 busy=true;
 try{
  const entry=path?await api('open',{path}):null;
  for(const id of ['title','summary','tags','slug'])$(id).value='';
  $('date').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
  if(entry){
   for(const id of ['title','date','summary'])$(id).value=entry.meta[id]||'';
   $('tags').value=(entry.meta.tags||[]).join(', ');
   $('kind').value=path.split('/')[1];
   $('slug').value=path.split('/').pop().slice(0,-3);
  }
  $('kind').disabled=$('slug').disabled=Boolean(path);
  editor.innerHTML=entry?.html||'';
  range=null;opened=path;revision=entry?.version||null;dirty=bodyChanged=false;
  status(path?'기존 글을 열었습니다. 수식·표 등 복잡한 본문은 GitHub의 원본 편집기를 이용하세요.':'새 글을 작성하세요.');
 }catch(e){postList.value=opened;status(e.message);}finally{busy=false;}
};
$('form').addEventListener('submit',async e=>{
 e.preventDefault();
 if(busy)return;
 if(!get('title')||!editor.textContent.trim()){status('제목과 본문을 입력하세요.');return;}
 if(opened&&bodyChanged&&!confirm('본문을 서식 편집기의 Markdown으로 다시 변환합니다. 표·수식·특수 서식이 있는 글은 원본 편집기를 사용하세요. 계속 저장할까요?'))return;
 const path=opened||('content/'+get('kind')+'/'+(get('slug')||get('date')+'-'+Date.now().toString(36))+'.md');
 busy=true;
 try{
  const result=await api('save',{path,version:revision,meta:{title:get('title'),summary:get('summary'),date:get('date'),tags:get('tags').split(',').map(t=>t.trim()).filter(Boolean)},body:!opened||bodyChanged?markdown(editor).trim():null});
  opened=path;revision=result.version;dirty=bodyChanged=false;
  $('kind').disabled=$('slug').disabled=true;
  status('저장했습니다. Codespaces Source Control에서 변경 내용을 확인하고 커밋·푸시하세요.');
  await refresh();
 }catch(e){status(e.message);}finally{busy=false;}
});
refresh().catch(e=>status(e.message));
</script>
</html>
