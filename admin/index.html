<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>블로그 글쓰기</title>
<style>
  :root { color-scheme: light dark; }
  body { max-width: 960px; margin: 36px auto; padding: 0 20px;
         font: 16px/1.6 system-ui, sans-serif; }
  h1, h2 { line-height: 1.3; }
  label { display: grid; gap: 4px; margin-bottom: 14px; }
  input, select, textarea, button { font: inherit; padding: 8px; }
  textarea { min-height: 240px; resize: vertical; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  #preview p { white-space: pre-wrap; overflow-wrap: anywhere; }
  @media (max-width: 650px) { .grid { grid-template-columns: 1fr; gap: 0; } }
</style>
</head>
<body>
<p><a href="../">블로그로 돌아가기</a></p>
<h1>블로그 글쓰기</h1>
<p>입력한 글은 GitHub에 커밋하기 전까지 전송되지 않아요.</p>

<form id="writer">
  <div class="grid">
    <label>글 종류
      <select id="category"><option value="notes">기술 노트</option>
      <option value="journal">일기</option></select>
    </label>
    <label>날짜 <input id="date" type="date" required></label>
  </div>
  <label>제목 <input id="title" required></label>
  <label>파일 이름 <input id="slug" pattern="[a-z0-9]+(-[a-z0-9]+)*"
    placeholder="비워두면 날짜를 포함한 이름을 자동 생성"></label>
  <label>한 줄 요약 <input id="summary"></label>
  <label>태그 <input id="tags" placeholder="예: 알고리즘, C++"></label>
  <div class="grid">
    <label>본문 (Markdown)<textarea id="body" required
      placeholder="## 소제목&#10;&#10;여기에 글을 쓰세요."></textarea></label>
    <section aria-label="본문 미리보기">
      <h2>간단한 미리보기</h2>
      <div id="preview"></div>
    </section>
  </div>
  <button type="submit">발행용 파일 만들기</button>
</form>

<section id="result" hidden>
  <h2>GitHub에 올릴 파일</h2>
  <p>경로: <code id="path"></code></p>
  <div class="actions">
    <button id="copy">Markdown 복사</button>
    <button id="download">다운로드</button>
    <a id="open" target="_blank" rel="noopener">GitHub에서 새 파일 만들기</a>
  </div>
  <p id="status" role="status"></p>
  <label>생성된 Markdown<textarea id="source" readonly></textarea></label>
</section>

<h2>기존 내용 수정</h2>
<ul>
  <li><a href="https://github.dev/geon0407/geon0407.github.io">GitHub 웹 편집기 열기</a></li>
  <li>자기소개·관심 분야: <code>content/about.md</code></li>
  <li>프로젝트 카드: <code>content/projects/</code> 아래의 해당 파일</li>
</ul>

<script>
const el = id => document.getElementById(id);
const value = id => el(id).value.trim();
const now = new Date();
el('date').value = [
  now.getFullYear(),
  String(now.getMonth() + 1).padStart(2, '0'),
  String(now.getDate()).padStart(2, '0')
].join('-');

function preview() {
  const items = [];
  if (value('title')) {
    const heading = document.createElement('h3');
    heading.textContent = value('title');
    items.push(heading);
  }
  for (const block of value('body').split(/\n\s*\n/)) {
    if (!block) continue;
    const match = /^(#{1,6}) (.+)$/.exec(block);
    const node = document.createElement(match ? 'h' + Math.min(match[1].length + 2, 6) : 'p');
    node.textContent = match ? match[2] : block;
    items.push(node);
  }
  el('preview').replaceChildren(...items);
}

el('writer').addEventListener('input', () => {
  preview();
  el('result').hidden = true;
});

let filename = '';
el('writer').addEventListener('submit', event => {
  event.preventDefault();
  if (!value('title') || !value('body')) {
    alert('제목과 본문을 입력해 주세요.');
    return;
  }
  const category = value('category');
  const date = value('date');
  const slug = value('slug') || `${date}-${Date.now().toString(36)}`;
  filename = `${slug}.md`;
  const path = `content/${category}/${filename}`;
  const tags = value('tags').split(',').map(tag => tag.trim()).filter(Boolean);
  el('source').value = [
    '---',
    `title: ${JSON.stringify(value('title'))}`,
    `date: ${JSON.stringify(date)}`,
    `summary: ${JSON.stringify(value('summary'))}`,
    `tags: ${JSON.stringify(tags)}`,
    'draft: false',
    '---', '', value('body'), ''
  ].join('\n');
  el('path').textContent = path;
  el('open').href =
    'https://github.com/geon0407/geon0407.github.io/new/main/content/' + category;
  el('status').textContent = `GitHub 파일 이름 칸에 ${filename}을 입력하세요.`;
  el('result').hidden = false;
});

el('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(el('source').value);
    el('status').textContent = `복사했어요. GitHub에서 ${filename} 파일의 본문에 붙여 넣으세요.`;
  } catch {
    el('source').focus();
    el('source').select();
    el('status').textContent = '아래 내용을 선택했어요. Ctrl+C로 복사하세요.';
  }
});

el('download').addEventListener('click', () => {
  const url = URL.createObjectURL(new Blob([el('source').value], {
    type: 'text/markdown;charset=utf-8'
  }));
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
</script>
</body>
</html>
