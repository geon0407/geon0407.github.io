backend:
  name: turbo-github
  turbo_site_id: REPLACE_WITH_TURBO_SITE_ID
  branch: main
locale: ko
slug:
  encoding: ascii
  clean_accents: true
site_url: https://geon0407.github.io
display_url: https://geon0407.github.io
media_folder: assets/images
public_folder: /assets/images
collections:
  - name: home
    label: 홈 소개
    files:
      - name: about
        label: 자기소개와 관심 분야
        file: content/about.md
        format: yaml-frontmatter
        fields:
          - {label: 본문, name: body, widget: markdown}
  - name: projects
    label: 프로젝트
    folder: content/projects
    create: true
    identifier_field: title
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    extension: md
    format: yaml-frontmatter
    fields:
      - &title {label: 제목, name: title, widget: string}
      - &summary {label: 요약, name: summary, widget: string, required: false}
      - &tags {label: 태그, name: tags, widget: list, required: false}
      - {label: 표시 순서, name: order, widget: number, value_type: int, default: 100, min: 0}
      - &draft {label: 사이트에서 숨기기, name: draft, widget: boolean, default: false}
      - &body {label: 본문, name: body, widget: markdown}
  - name: notes
    label: 기술 노트
    folder: content/notes
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    extension: md
    format: yaml-frontmatter
    fields:
      - *title
      - &date {label: 날짜, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD}
      - *summary
      - *tags
      - *draft
      - *body
  - name: journal
    label: 일기
    folder: content/journal
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    extension: md
    format: yaml-frontmatter
    fields:
      - *title
      - *date
      - *summary
      - *tags
      - *draft
      - {label: 표지 사진, name: cover, widget: image, required: false}
      - {label: 장소, name: location, widget: string, required: false}
      - *body
