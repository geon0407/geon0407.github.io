{% assign c = "c-page-heading" %}
<div class="container">
  <div class="{{c}}">
    <h1 class="{{c}}__title"{% if include.title_ko %} data-ko="{{ include.title_ko | escape }}"{% endif %}>{{ include.title }}</h1>
    {% if include.description %}
      <p class="{{c}}__description"{% if include.description_ko %} data-ko="{{ include.description_ko | escape }}"{% endif %}>{{ include.description }}</p>
    {% endif %}
  </div>
</div>
