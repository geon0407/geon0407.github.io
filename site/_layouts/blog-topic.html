---
layout: default
---
{% bookshop page-heading title=page.title %}
<section class="container blog-topic">
  <a href="{{ '/blog/' | relative_url }}">Back to Blog</a>
  {% assign posts = site.categories[page.topic] %}
  {% if posts.size > 0 %}
    <div class="row">{% for post in posts %}{% bookshop blog-card post=post %}{% endfor %}</div>
  {% else %}
    <p>No posts published yet.</p>
  {% endif %}
</section>
