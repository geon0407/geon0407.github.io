---
layout: default
---
{% bookshop page-heading title=page.title title_ko=page.title_ko %}
<section class="container blog-topic">
  <a href="{{ '/blog/' | relative_url }}" data-ko="블로그로 돌아가기">Back to Blog</a>
  {% assign posts = site.categories[page.topic] %}
  {% if posts.size > 0 %}
    <div class="row">{% for post in posts %}{% bookshop blog-card post=post %}{% endfor %}</div>
  {% else %}
    <p data-ko="아직 게시된 글이 없습니다">No posts published yet.</p>
  {% endif %}
</section>
