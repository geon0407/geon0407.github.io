<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' | escape }}">

{% include head.html %}

<body>

    {% if site.data.general_settings.google-analytics %}
        {% include google-analytics.html %}
    {% endif %}

    {% include header.html %}

    {{ content }}

    <!--
        Bookshop components are accessed using the bookshop tag,
        using the same syntax as the standard Jekyll include tag.
    -->
    {% bookshop_include page content_blocks=page.content_blocks page_theme=page.page_theme %}

    <div class="top" title="Top"><ion-icon name="arrow-up"></ion-icon></div>

    {% include footer.html %}

    <script src="/js/scripts.js"></script>
    <script src="/js/common.js"></script>
    <script src="{{ '/js/blog-menu.js' | relative_url }}" defer></script>
    <script src="{{ '/js/language.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
    <script src="{{ '/js/content-tools.js' | relative_url }}" defer></script>
    <script src="{{ '/js/contact.js' | relative_url }}" defer></script>
</body>
</html>
