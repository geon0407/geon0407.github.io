{% comment %} Email line under the home greeting (social links are already in the header). {% endcomment %}
{% assign contact_email = site.data.studio.profile.contact.email | default: "" | strip %}
{% if contact_email != "" %}
<ul class="contact-line list-reset">
  <li><ion-icon name="mail-outline" aria-hidden="true"></ion-icon>{% include contact-email.html %}</li>
</ul>
{% endif %}
