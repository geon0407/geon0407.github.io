---
title: Projects
---
<main class="container personal-page">
  <h1>{% include localized.html key="projects" %}</h1>
  {% if site.projects.size > 0 %}
    <div class="row">
      {% for project in site.projects %}
        {% bookshop project-card project=project %}
      {% endfor %}
    </div>
  {% else %}
    <p>{% include localized.html key="no_projects" %}</p>
  {% endif %}
</main>
