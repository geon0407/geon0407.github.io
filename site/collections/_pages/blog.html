---
title: Blog
---
<main class="container personal-page">
  <h1>{% include localized.html key="blog" %}</h1>
  {% if site.posts.size > 0 %}
    <div class="row">
      {% for post in site.posts %}
        {% bookshop blog-card post=post %}
      {% endfor %}
    </div>
  {% else %}
    <p>{% include localized.html key="no_posts" %}</p>
  {% endif %}
</main>
